name: test

on:
  workflow_call:

jobs:
  go:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: [ "1.27" ]

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Copy swagger docs dummy file and Create dummy ui/dist/index.html
        run: mkdir ui/dist && touch ui/dist/index.html

      - name: Test
        run: go test `go list ./... | grep -v docs/swagger`

  ui:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ "26.13" ]

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ui
        run: npx playwright install --with-deps

      - name: Run UI tests
        working-directory: ui
        run: npm test