name: lint
on:
  workflow_call:

permissions:
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  # pull-requests: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [ "1.27" ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
      #          cache: false

      - name: Copy swagger docs dummy file and Create dummy ui/dist/index.html
        run: mkdir ui/dist && touch ui/dist/index.html

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Require: The version of golangci-lint to use.
          # When `install-mode` is `binary` (default) the value can be v1.2 or v1.2.3 or `latest` to use the latest version.
          # When `install-mode` is `goinstall` the value can be v1.2.3, `latest`, or the hash
          version: v2.15
          args: --timeout 3m0s

  ui:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ "26.13" ]

    steps:
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: npm ci
        working-directory: ui
      - run: npm run prettier
        working-directory: ui
      - run: npm ci
        working-directory: e2e
      - run: npm run prettier
        working-directory: e2e